services:
  # ==========================================
  # 1. FastAPI Backend Web Service
  # ==========================================
  - type: web
    name: nexusprod-backend
    env: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        fromService:
          type: web
          name: nexusprod-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: FACTORY_TIMEZONE
        value: "Asia/Kolkata"
      - key: DATABASE_URL
        fromDatabase:
          name: nexusprod-db
          property: connectionString

  # ==========================================
  # 2. React + Vite Frontend Static Site
  # ==========================================
  - type: web
    name: nexusprod-frontend
    env: static
    rootDir: frontend
    plan: free
    region: oregon
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: nexusprod-backend
          envVarKey: RENDER_EXTERNAL_URL
          transform: "${RENDER_EXTERNAL_URL}/api"

# ==========================================
# 3. Managed PostgreSQL Database
# ==========================================
databases:
  - name: nexusprod-db
    databaseName: nexusprod_db
    user: nexusprod_user
    plan: free
    region: oregon
