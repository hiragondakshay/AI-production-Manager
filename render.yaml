
services:
  # 1. FastAPI Backend
  - type: web
    name: nexusprod-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: FACTORY_TIMEZONE
        value: "Asia/Kolkata"
      - key: DATABASE_URL
        fromDatabase:
          name: nexusprod-db
          property: connectionString

  # 2. React + Vite Frontend
  - type: static
    name: nexusprod-frontend
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist

  # 3. PostgreSQL Database
databases:
  - name: nexusprod-db
    databaseName: nexusprod_db
    user: nexusprod_user
    plan: free
    region: oregon
